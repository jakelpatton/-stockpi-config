name: Update sector outlook

on:
  schedule:
    # After the US market close year-round (22:20 UTC covers EST and EDT).
    - cron: '20 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build sector outlook
        run: python3 stockpi/update_sector_outlook.py

      - name: Commit changed sector data
        run: |
          if git diff --quiet -- stockpi/static/sector-outlook.json; then
            echo "Sector outlook is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stockpi/static/sector-outlook.json
          git commit -m "Update daily sector outlook"
          git push
