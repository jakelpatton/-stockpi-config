<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Patton Estate • Webull Order History</title>
<style>
:root{--black:#060907;--green:#0c1511;--green2:#111b16;--brass:#b4853e;--brass2:#d2ad69;--brass3:#725022;--ivory:#eadfc7;--muted:#b9aa8c;--good:#8ca883;--danger:#d38d82;--line:rgba(203,159,79,.38);--serif:Baskerville,"Iowan Old Style","Palatino Linotype",Georgia,serif;--sans:Inter,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -15%,#352515,#0b100d 42%,#050706);color:var(--ivory);font-family:var(--serif)}body{padding:22px}.shell{max-width:1500px;margin:auto;border:1px solid var(--brass3);box-shadow:0 18px 50px #000;background:#09100c}.head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:end;justify-content:space-between;gap:20px}.kicker{font:800 10px var(--sans);letter-spacing:.16em;color:var(--brass2)}h1{margin:4px 0 0;font-size:34px;font-weight:500;color:var(--brass2)}.status{text-align:right;color:var(--muted)}.controls{display:grid;grid-template-columns:1fr 180px 180px;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);background:#0c130f}input,select{width:100%;padding:11px 12px;border:1px solid var(--brass3);background:#07100b;color:var(--ivory);font:14px var(--sans)}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:12px 20px}.summary div{border:1px solid var(--line);background:var(--green2);padding:10px 12px}.summary span{display:block;font:800 9px var(--sans);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}.summary b{display:block;margin-top:4px;color:var(--brass2);font-size:22px}.table-wrap{overflow:auto;padding:0 20px 20px}table{width:100%;border-collapse:collapse;min-width:1250px}th{position:sticky;top:0;background:#101811;color:var(--brass2);font:800 9px var(--sans);letter-spacing:.08em;text-transform:uppercase;text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}td{padding:10px 8px;border-bottom:1px solid rgba(203,159,79,.16);font-size:13px}tr:hover td{background:rgba(180,133,62,.05)}.buy{color:var(--good);font-weight:700}.sell{color:#d7a18f;font-weight:700}.status-pill{display:inline-block;border:1px solid var(--brass3);padding:4px 7px;font:800 9px var(--sans);letter-spacing:.04em}.filled{color:#d9ead3;border-color:#657b5f}.rejected,.failed{color:var(--danger);border-color:#8f4038}.muted{color:var(--muted)}.empty{text-align:center;padding:50px;color:var(--muted)}@media(max-width:800px){body{padding:0}.head{align-items:start;flex-direction:column}.status{text-align:left}.controls{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.table-wrap{padding:0 10px 20px}}
</style>
</head>
<body>
<div class="shell">
  <div class="head"><div><div class="kicker">PATTON ESTATE • WEBULL • QUERY-ONLY VIEW</div><h1>Complete Order History</h1></div><div class="status" id="status">Loading local Webull activity…</div></div>
  <div class="controls"><input id="search" placeholder="Search symbol, status, side, order type…"><select id="side"><option value="">All sides</option><option>BUY</option><option>SELL</option></select><select id="state"><option value="">All statuses</option><option>FILLED</option><option>PARTIAL_FILLED</option><option>SUBMITTED</option><option>CANCELLED</option><option>CANCELED</option><option>REJECTED</option><option>FAILED</option></select></div>
  <div class="summary"><div><span>All History</span><b id="all">—</b></div><div><span>Open</span><b id="open">—</b></div><div><span>Today</span><b id="today">—</b></div><div><span>Filled Today</span><b id="filled">—</b></div><div><span>Live Events</span><b id="events">—</b></div></div>
  <div class="table-wrap"><table><thead><tr><th>Date / Time</th><th>Symbol</th><th>Side</th><th>Status</th><th>Type</th><th>Qty</th><th>Filled</th><th>Fill Price</th><th>Limit / Stop</th><th>TIF</th><th>Commission</th><th>Fees</th><th>Order ID</th></tr></thead><tbody id="body"></tbody></table></div>
</div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>{let x=Number(v);return Number.isFinite(x)?x:null};
const money=v=>n(v)==null?'—':n(v).toLocaleString(undefined,{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:2});
const qty=v=>n(v)==null?'—':n(v).toLocaleString(undefined,{maximumFractionDigits:5});
const time=v=>{if(!v)return'—';let s=String(v),d=/^\d+$/.test(s)?new Date(Number(s)>1e12?Number(s):Number(s)*1000):new Date(s);return Number.isNaN(d.getTime())?s:d.toLocaleString()};
let data={history:[],counts:{},real_time_events:[]};
function render(){let q=document.getElementById('search').value.toLowerCase(),side=document.getElementById('side').value,state=document.getElementById('state').value;let rows=(data.history||[]).filter(o=>{let hay=[o.symbol,o.status,o.side,o.order_type,o.time_in_force,o.client_order_id,o.order_id].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!side||String(o.side).toUpperCase()===side)&&(!state||String(o.status).toUpperCase()===state)});document.getElementById('body').innerHTML=rows.length?rows.map(o=>{let st=String(o.status||'UNKNOWN').toUpperCase();let px=n(o.limit_price)!=null?'Limit '+money(o.limit_price):n(o.stop_price)!=null?'Stop '+money(o.stop_price):'—';return`<tr><td>${esc(time(o.place_time||o.filled_time))}</td><td><b>${esc(o.symbol||'—')}</b></td><td class="${String(o.side).toLowerCase()}">${esc(o.side||'—')}</td><td><span class="status-pill ${st.toLowerCase()}">${esc(st)}</span></td><td>${esc(o.order_type||'—')}</td><td>${qty(o.quantity)}</td><td>${qty(o.filled_quantity)}</td><td>${money(o.filled_price)}</td><td>${px}</td><td>${esc(o.time_in_force||'—')}</td><td>${money(o.commission)}</td><td>${money(o.fees)}</td><td class="muted">${esc(o.client_order_id||o.order_id||'—')}</td></tr>`}).join(''):`<tr><td colspan="13" class="empty">No orders match the current filters.</td></tr>`;}
async function refresh(){try{let r=await fetch('/static/webull-activity.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Activity monitor has not written data yet');data=await r.json();let c=data.counts||{};document.getElementById('all').textContent=c.history??'—';document.getElementById('open').textContent=c.open??'—';document.getElementById('today').textContent=c.today??'—';document.getElementById('filled').textContent=c.filled_today??'—';document.getElementById('events').textContent=(data.real_time_events||[]).length;document.getElementById('status').textContent=data.connected?`Webull connected • ${data.event_stream||'polling'} • updated ${time(data.updated)}`:`${data.error||'Waiting for Webull'} • read-only`;render()}catch(e){document.getElementById('status').textContent=e.message}}
['search','side','state'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',render));refresh();setInterval(refresh,5000);
</script>
</body>
</html>
